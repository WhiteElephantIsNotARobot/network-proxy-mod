# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# MC 26.3 ships deobfuscated classes; Java 25 runs Minecraft 26.x, Java 21 is
# used by ModDevGradle's asset download step. Both are auto-detected from the
# usual JDK locations, so no explicit installation paths are pinned here.

# Minecraft / Loaders
minecraft_version=26.3
loader_version=0.20.1
loom_version=1.18.4
neoForge_version=26.3.0.99
modDevGradle_version=2.0.148
netty_version=4.2.16.Final

# Mod
mod_version=2.1.1
maven_group=com.misaka10843.networkproxy
archives_base_name=networkproxy
